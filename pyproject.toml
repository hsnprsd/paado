[project]
name = "paado"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "openai-agents>=0.22.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[project.scripts]
paado = "cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config", "loop", "paado", "providers"]
packages = ["plugins", "prompts"]

[tool.setuptools.package-data]
prompts = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
